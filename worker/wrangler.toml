name = "hawkbucks-web"
main = "index.js"
compatibility_date = "2026-08-10"

# Phase 4: the backend Worker is internal-only. It is reached exclusively
# through the `HAWKBUCKS_API` Service Binding from the frontend Worker
# (frontend/wrangler.json) - Service Bindings invoke the Worker directly and
# do not require any public URL. Disabling the workers.dev subdomain removes
# the public HawkBucks API endpoint. Cron triggers are unaffected.
# Rollback: delete this line (or set it to true) and redeploy the Worker.
workers_dev = false

[[kv_namespaces]]
binding = "HAWKBUCKS_CACHE"
id = "19e23aa284f648de8acec40e5f963e35"

[[d1_databases]]
binding = "DB"
database_name = "hawkbucks-data"
database_id = "ef9831f2-2d9c-4c11-a49e-c1935ae5edb7"
migrations_dir = "migrations"

[triggers]
crons = ["*/30 * * * *"]