name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Lint
        run: npm run lint --if-present

      # Build BEFORE tests: cloudflare-pages-runtime + csp-phase23 exercise
      # the real production bundle (.output/server/index.mjs) and skip when
      # it is absent. Building first keeps that end-to-end proof running in
      # CI instead of silently skipping on every run.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:server --if-present

      - name: Type check
        run: npx tsc --noEmit

  worker:
    name: Worker validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Test
        run: npm test

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
